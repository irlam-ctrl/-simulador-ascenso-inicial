<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe4"><title>Simulador Ascenso · EBR Inicial</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell"><header class="hero"><p class="kicker">EBR · EDUCACIÓN INICIAL</p><h1>Simulador de Ascenso</h1><p>Banco de 360 preguntas de las pruebas oficiales 2019–2025.</p></header>
<section id="config" class="card"><div class="cardTitle"><div><p class="kicker">PREPARACIÓN</p><h2>Configura tu práctica</h2></div><div class="bubble"><strong id="count">360</strong><span>casos</span></div></div>
<label>TEMA<select id="tema"><option>Todos</option><option>Inclusión y diversidad</option><option>Comunicación</option><option>Convivencia y resolución de conflictos</option><option>Matemática</option><option>Evaluación formativa</option><option>Desarrollo y aprendizaje</option><option>Psicomotricidad</option><option>Planificación y procesos pedagógicos</option><option>Indagación</option><option>Juego libre</option><option>Autonomía y cuidados</option></select></label>
<label>CICLO<select id="ciclo"><option>Todos</option><option>0–2 años</option><option>3–5 años</option><option>General</option></select></label>
<label>PRUEBA<select id="year"><option>Todas</option><option>2019</option><option>2021</option><option>2022 / aplicado ene. 2023</option><option>2023</option><option>2024</option><option>2025</option></select></label>
<label>ESTADO<select id="state"><option>Todas</option><option>Pendientes</option><option>Falladas</option><option>Acertadas</option><option>Favoritas</option></select></label>
<button id="practice">Comenzar práctica</button><button id="exam" class="ghost">Modo examen · 60 preguntas · 3 h</button>
<button id="reset" class="ghost">Restablecer progreso</button></section>
<section id="quiz" class="card hidden"><div class="topline"><button id="back" class="mini">← Salir</button><span id="progress"></span><span id="timer"></span><button id="fav" class="mini">☆</button></div><div class="meta" id="meta"></div><h2 id="question"></h2><div id="options"></div><button id="check" disabled>Comprobar respuesta</button><div id="feedback" class="feedback hidden"></div><button id="next" class="hidden">Siguiente caso →</button></section>
<section class="stats"><div><strong id="answered">0</strong><span>Respondidas</span></div><div><strong id="accuracy">0%</strong><span>Aciertos</span></div><div><strong id="favorites">0</strong><span>Favoritas</span></div></section>
<footer>Las respuestas correctas se contrastan con las claves oficiales. La explicación de estudio es complementaria.</footer></main><script src="questions.js"></script><script src="app.js"></script></body></html>
